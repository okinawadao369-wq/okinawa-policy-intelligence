name: Fetch e-Stat (SSDS municipal data)
# fetch/** ブランチへの push か手動実行でのみ動く。取得結果は同じブランチにコミットし、PR で人間がレビューして main に取り込む。
on:
  push:
    branches: ["fetch/**"]
    paths: ["etl/fetch_estat_ssds.py", ".github/workflows/fetch-estat.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-estat
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python -I etl/fetch_estat_ssds.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estat
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "e-Stat SSDS fetch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
